<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jóvenes en Acción - Perfiles</title>

    <style>
        /* Los estilos CSS se agregarán posteriormente */

/* CONFIGURACIÓN GENERAL */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f5fb;
    color: #172b4d;
}


/* ENCABEZADO */

header {
    background: #102b50;
    color: white;
    padding: 22px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

header h1 {
    font-size: 25px;
    letter-spacing: 1px;
}

header p {
    font-size: 14px;
}


/* DISTRIBUCIÓN PRINCIPAL */

main {
    display: flex;
    min-height: 85vh;
}


/* MENÚ DE INTEGRANTES */

.menu {
    width: 210px;
    background: white;
    padding: 25px 15px;
    border-right: 1px solid #dce4f0;
}

.menu h2 {
    font-size: 19px;
    margin-bottom: 20px;
    color: #173d70;
}

.menu button {
    display: block;
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    border: 1px solid #dce4f0;
    border-radius: 9px;
    background: #edf4ff;
    color: #145db0;
    font-weight: bold;
    cursor: pointer;
}

.menu button:hover {
    background: #cfe3ff;
}


/* CONTENIDO */

.contenido {
    flex: 1;
    min-width: 0;
    padding: 30px;
}


/* PORTADA DEL PERFIL */

.portada {
    background: linear-gradient(120deg, #1766b5, #dcecff);
    padding: 30px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 25px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.portada h2 {
    font-size: 29px;
    margin-bottom: 12px;
    color: #102b50;
}

.portada p {
    margin: 7px 0;
    font-size: 15px;
}


/* AVATAR */

.avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: white;
    border: 5px solid white;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #1766b5;
    font-size: 32px;
    font-weight: bold;
}


/* TARJETAS DE INFORMACIÓN */

.tarjetas {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.tarjeta {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px #00000012;
}

.tarjeta h3 {
    background: #102b50;
    color: white;
    padding: 15px;
    font-size: 17px;
}

.tarjeta div {
    padding: 17px;
    line-height: 1.8;
    overflow-wrap: anywhere;
}


/* NAVEGACIÓN ENTRE PERFILES */

.navegacion {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 25px;
    gap: 12px;
    flex-wrap: wrap;
}

.navegacion button {
    padding: 13px 20px;
    border: none;
    border-radius: 8px;
    background: #145db0;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.navegacion button:hover {
    background: #102b50;
}

#contador {
    font-weight: bold;
    color: #173d70;
}


/* ADAPTACIÓN A CELULARES */

@media (max-width: 750px) {

    main {
        flex-direction: column;
    }

    .menu {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .menu h2 {
        width: 100%;
    }

    .menu button {
        flex: 1;
        width: auto;
    }

    .contenido {
        padding: 15px;
    }

    .tarjetas {
        grid-template-columns: 1fr;
    }

    .portada {
        padding: 20px;
    }

    .portada h2 {
        font-size: 23px;
    }

}

    </style>
</head>

<body>

    <header>
        <h1>JÓVENES EN ACCIÓN</h1>
        <p>Construyendo un mejor futuro</p>
    </header>

    <main>

        <aside class="menu">
            <h2>Integrantes</h2>

            <button onclick="mostrarPerfil(0)">Integrante 1</button>
            <button onclick="mostrarPerfil(1)">Integrante 2</button>
            <button onclick="mostrarPerfil(2)">Integrante 3</button>
        </aside>

        <section class="contenido">

            <div class="portada">
                <div class="avatar" id="avatar">I1</div>
                <div>
                    <h2 id="nombre">Nombre del integrante</h2>
                    <p id="edad">Edad:</p>
                    <p id="ciudad">Ciudad:</p>
                    <p id="ministerio">Ministerio:</p>
                </div>
            </div>

            <div class="tarjetas">

                <article class="tarjeta">
                    <h3>Información personal</h3>
                    <div id="personal"></div>
                </article>

                <article class="tarjeta">
                    <h3>Formación académica</h3>
                    <div id="academica"></div>
                </article>

                <article class="tarjeta">
                    <h3>Sobre mí</h3>
                    <div id="descripcion"></div>
                </article>

                <article class="tarjeta">
                    <h3>Habilidades y fortalezas</h3>
                    <div id="habilidades"></div>
                </article>

                <article class="tarjeta">
                    <h3>Información de contacto</h3>
                    <div id="contacto"></div>
                </article>

                <article class="tarjeta">
                    <h3>Áreas de especialización</h3>
                    <div id="especialidades"></div>
                </article>

            </div>

            <div class="navegacion">
                <button onclick="cambiarPerfil(-1)">
                    ← Perfil anterior
                </button>

                <span id="contador">Integrante 1 de 3</span>

                <button onclick="cambiarPerfil(1)">
                    Siguiente perfil →
                </button>
            </div>

        </section>

    </main>

    <script>
        // INFORMACIÓN DE LOS INTEGRANTES

const integrantes = [

    {
        Nombre: "Brendan Elkin Angel Peréz",
        Edad: "18 años",
        Ciudad: "General Antonio Elizalde",
        Ministerio: "Ministerio de desarrollo económico y productivo",

        Descripción:
            "Soy una persona responsable, comprometida y perseverante. Me gusta aprender, trabajar en equipo y asumir nuevos retos. Me caracterizo por mi organización, iniciativa y disposición para mejorar tanto personal como profesionalmente.",

        Estudios: "Educación superior (primer semestre)",
        Institucion: "Universidad estatal de Milagro",
        Carrera: "Ingeniería de Software",

        Telefono: "0967234567",
        Correo: "brendanperez@gmail.com",

        Habilidades: [
            "Trabajo en equipo",
            "Comunicación efectiva",
            "Aprendizaje rápido"
        ],

        Especialidades: [
            "Análisis  y resolución de problemas de software",
            "Bases de datos",
            "Fundamentos de programación"
        ]
    },

    {
        Nombre: "Britney del Carmen Montoya Macias",
        Edad: "18 años",
        Ciudad: "Canton Naranjal",
        Ministerio: "Ministerio de desarrollo económico y productivo",

        Descripción:
            "Soy una persona responsable, organizada y comprometida con las actividades que realizo. Me gusta aprender, trabajar en equipo y dar lo mejor de mí en cada tarea. Me caracterizo por mi disposición para seguir instrucciones, aportar ideas y tomar la iniciativa para liderar cuando sea necesario. Procuro mantener una actitud positiva, respetuosa y colaborativa",

        Estudios: "Educación superior (primer semestre)",
        Institucion: "Universidad estatal de Milagro",
        Carrera: "Ingeniería de Software",

        Telefono: "0985867894",
        Correo: "montoyamacias@gmail.com",

        Habilidades: [
            "Trabajo en equipo",
            "Liderazgo e iniciativa",
            "Organización y responsabilidad"
        ],

        Especialidades: [
            "Metodología ágil",
            "Programación básica",
            "Manejo de Git y GitHub"
        ]
    },

    {
        Nombre: "Bianka Ninoska Portilla Bravo",
        Edad: "18 años",
        Ciudad: "Duran",
        Ministerio: "Ministerio de Educación, Cultura y Deporte",

        Descripción:
            "Me caracterizo por ser una persona, imparcial y comunicativa. Me gusta mantener el orden, trabajar en equipo y participar en diferentes actividades. Estoy siempre dispuesta a aprender y adquirir nuevos conocimientos que contribuyan a mi crecimiento personal y profesional.",

        Estudios: "Educación superior (primer semestre)",
        Institucion: "Universidad estatal de Milagro",
        Carrera: "Ingeniería de Software",

        Telefono: "0998765432",
        Correo: "portillabravo@gmail.com",

        Habilidades: [
            "Trabajo en equipo",
            "Adaptabilidad",
            "Responsabilidad"
        ],

        Especialidades: [
            "Programación",
            "Desarrollo de software",
            "Desarrollo web"
        ]
    }

];

// VARIABLE PARA CONTROLAR EL PERFIL ACTUAL

let perfilActual = 0;


// FUNCIÓN PARA MOSTRAR LA INFORMACIÓN

function mostrarPerfil(indice) {

    perfilActual = indice;

    const persona = integrantes[indice];

    document.getElementById("nombre").textContent =
        persona.Nombre;

    document.getElementById("avatar").textContent =
        "I" + (indice + 1);

    document.getElementById("edad").textContent =
        "Edad: " + persona.Edad;

    document.getElementById("ciudad").textContent =
        "Ciudad: " + persona.Ciudad;

    document.getElementById("ministerio").textContent =
        "Ministerio: " + persona.Ministerio;


    // INFORMACIÓN PERSONAL

    document.getElementById("personal").innerHTML =
        "<p><b>Nombre:</b> " + persona.Nombre + "</p>" +
        "<p><b>Edad:</b> " + persona.Edad + "</p>" +
        "<p><b>Ciudad:</b> " + persona.Ciudad + "</p>" +
        "<p><b>Ministerio:</b> " + persona.Ministerio + "</p>";


    // FORMACIÓN ACADÉMICA

    document.getElementById("academica").innerHTML =
        "<p><b>Nivel de estudios:</b> " + persona.Estudios + "</p>" +
        "<p><b>Institución:</b> " + persona.Institucion + "</p>" +
        "<p><b>Carrera:</b> " + persona.Carrera + "</p>";


    // DESCRIPCIÓN PERSONAL

    document.getElementById("descripcion").textContent =
        persona.Descripción;


    // HABILIDADES

    document.getElementById("habilidades").textContent =
        persona.Habilidades.join(" • ");


    // INFORMACIÓN DE CONTACTO

    document.getElementById("contacto").innerHTML =
        "<p><b>Teléfono:</b> " + persona.Telefono + "</p>" +
        "<p><b>Correo:</b> " + persona.Correo + "</p>";


    // ÁREAS DE ESPECIALIZACIÓN

    document.getElementById("especialidades").textContent =
        persona.Especialidades.join(" • ");


    // CONTADOR DE PERFILES

    document.getElementById("contador").textContent =
        "Integrante " + (indice + 1) + " de 3";

}


// FUNCIÓN PARA CAMBIAR DE PERFIL

function cambiarPerfil(direccion) {

    let nuevoPerfil = perfilActual + direccion;

    if (nuevoPerfil < 0) {
        nuevoPerfil = integrantes.length - 1;
    }

    if (nuevoPerfil >= integrantes.length) {
        nuevoPerfil = 0;
    }

    mostrarPerfil(nuevoPerfil);

}
    </script>

</body>
</html>
